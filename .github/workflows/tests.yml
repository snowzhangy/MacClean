name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # One library backs cleaner.py (macOS/Linux) and winclean.py (Windows),
        # so the suite has to run on all three platforms.
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python cleaner.py --help
      - run: python winclean.py --version
